framework:
    messenger:
        # Messages en échec définitif (après les nouvelles tentatives) : consultables avec
        # php bin/console messenger:failed:show
        failure_transport: failed

        transports:
            # File d'envoi des mails, stockée en base (table messenger_messages)
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 60000      # 1re nouvelle tentative après 1 min
                    multiplier: 5     # puis 5 min, puis 25 min
            failed: 'doctrine://default?queue_name=failed'

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
